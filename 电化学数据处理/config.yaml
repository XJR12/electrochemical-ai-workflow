figure:
  dpi: 600
  font: Arial
  figsize: [8.0, 6.0]

curve:
  linewidth: 2.0
  marker: none

axis:
  xlabel: "Potential (V vs. RHE)"
  ylabel: "Current density (mA·cm$^{-2}$)"
  x_min: 1.4
  x_major_step: 0.05
  x_minor_step: 0.025
  fontweight: bold

legend:
  loc: upper left
  fontsize: 10

compare:
  gap_mv: 5.0
  sanity_mv: 0.0
  exclude_mv: 100.0
  majority_ratio: 0.5
  x_end_pad: 0.01
  manual_groups: []

tafel:
  xlabel: "log(j / mA cm$^{-2}$)"
  ylabel: "Overpotential $\\eta$ (mV)"
  x_major_step: 1.0
  x_minor_step: 0.5
  y_major_step: 50.0
  y_minor_step: 10.0
  j_min: 1.0
  j_max: null
  eta_min: null
  eta_max: null
  fontweight: bold
